<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Discord OAuth2 Channel Embed Demo</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f6f8fb; }
    button { padding: 10px 16px; border-radius: 6px; background: #5865f2; color: white; border: none; cursor: pointer; }
    pre { background: #fff; padding: 10px; border-radius: 6px; max-height: 400px; overflow: auto; }
  </style>
</head>
<body>
  <h1>Discord OAuth2 Channel Embed Demo</h1>
  <button id="loginBtn">Login with Discord</button>

  <h2>User Data</h2>
  <pre id="userData">Not logged in</pre>

  <script>
    const loginBtn = document.getElementById('loginBtn');
    const userDataPre = document.getElementById('userData');

    const CLIENT_ID = "1421616821995442306"; // Your Discord App Client ID
    const REDIRECT_URI = encodeURIComponent("http://localhost:3000/callback");
    const SCOPE = encodeURIComponent("identify email");
    const oauthUrl = `https://discord.com/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${REDIRECT_URI}&response_type=code&scope=${SCOPE}`;

    loginBtn.addEventListener('click', () => {
      window.location.href = oauthUrl;
    });

    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    if (code) {
      userDataPre.textContent = "Exchanging code for access token…";

      fetch('/send-dm?code=' + encodeURIComponent(code))
        .then(r => r.json())
        .then(data => {
          userDataPre.textContent = JSON.stringify(data, null, 2);
        })
        .catch(err => {
          userDataPre.textContent = "Error: " + err;
        });
    }
  </script>
</body>
</html>
