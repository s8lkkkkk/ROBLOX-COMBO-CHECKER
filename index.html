<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Discord OAuth2 Demo</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f6f8fb; }
    button { padding: 10px 16px; border-radius: 6px; background: #5865f2; color: white; border: none; cursor: pointer; }
    pre { background: #fff; padding: 10px; border-radius: 6px; max-height: 400px; overflow: auto; }
  </style>
</head>
<body>
  <h1>Discord OAuth2 Demo</h1>
  <button id="loginBtn">Login with Discord</button>

  <h2>User Data</h2>
  <pre id="userData">Not logged in</pre>

  <script>
    const loginBtn = document.getElementById('loginBtn');
    const userDataPre = document.getElementById('userData');

    // Your exact OAuth2 URL
    const oauthUrl = "https://discord.com/oauth2/authorize?client_id=1421616821995442306&permissions=8&response_type=code&redirect_uri=https%3A%2F%2Fdiscord.com%2Fdevelopers%2Fapplications%2FYOUR_BOT_ID%2Foauth2%2Furl-generator&integration_type=1&scope=identify+guilds+voice+bot+email+guilds.join+connections+gdm.join";

    loginBtn.addEventListener('click', () => {
      window.location.href = oauthUrl;
    });

    // When redirected back with ?code=AUTH_CODE
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    if (code) {
      userDataPre.textContent = "Exchanging code for access token…";

      // Send code to your server endpoint (server exchanges for token safely)
      fetch('/api/auth/callback?code=' + encodeURIComponent(code))
        .then(r => r.json())
        .then(data => {
          userDataPre.textContent = JSON.stringify(data, null, 2);
        })
        .catch(err => {
          userDataPre.textContent = "Error: " + err;
        });
    }
  </script>
</body>
</html>
